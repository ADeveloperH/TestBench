# 双平台构建 TestBench 安装包（Windows + macOS）
# 触发方式：
#   1. 手动：仓库页面 → Actions → 本 workflow → Run workflow
#      产物在每次运行的 Artifacts 里下载（内部测试用）
#   2. 自动：推送 v* 标签（如 v0.1.0）
#      构建完成后自动创建 GitHub Release 并上传安装包与 macOS 更新产物
#      （.app.tar.gz + latest.json），用户从 Releases 下载、App 内自动更新
#
# 依赖仓库 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY           updater 签名私钥内容（~/.tauri/internal-workbench.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（本项目为空密码）
name: 构建安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# createUpdaterArtifacts 会让所有平台构建都签名 updater 产物，需全局注入私钥
env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  build-windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install

      - name: 生成内置 adb / scrcpy 二进制
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-binaries.ps1

      - name: 构建 Windows 安装包
        run: pnpm tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: testbench-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    name: macOS 安装包（${{ matrix.arch }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            # macos-13 已于 2025-09 停用；x64(Intel) 构建改用 macos-15-intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install

      - name: 生成内置 adb / scrcpy 二进制
        env:
          # macOS runner 新版 Homebrew 的 tap trust 校验会告警/阻断 brew install，禁用它
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install scrcpy dylibbundler
          mkdir -p src-tauri/bin/macos
          curl -L -o /tmp/platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          unzip -o -q /tmp/platform-tools.zip -d /tmp
          cp /tmp/platform-tools/adb src-tauri/bin/macos/adb
          chmod +x src-tauri/bin/macos/adb
          cp "$(brew --prefix)/bin/scrcpy" src-tauri/bin/macos/scrcpy
          cp "$(brew --prefix)/share/scrcpy/scrcpy-server" src-tauri/bin/macos/scrcpy-server
          chmod +x src-tauri/bin/macos/scrcpy
          cd src-tauri/bin/macos
          dylibbundler -od -b -x ./scrcpy -d ./lib/ -p @loader_path || true
          mv lib/*.dylib . 2>/dev/null || true

      - name: 构建 macOS 安装包
        run: pnpm tauri build

      # 两个架构的更新包同名，加架构后缀避免 Release 资产冲突
      - name: 重命名更新包（加架构后缀）
        run: |
          BUNDLE="src-tauri/target/release/bundle/macos"
          mv "$BUNDLE/TestBench.app.tar.gz" "$BUNDLE/TestBench_${{ matrix.arch }}.app.tar.gz"
          mv "$BUNDLE/TestBench.app.tar.gz.sig" "$BUNDLE/TestBench_${{ matrix.arch }}.app.tar.gz.sig"

      - name: 上传安装包与更新产物
        uses: actions/upload-artifact@v4
        with:
          name: testbench-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  # 仅 tag 推送触发：汇总三个平台的安装包 + macOS 更新产物，
  # 生成 latest.json，自动创建/补充 GitHub Release。
  # 手动触发（workflow_dispatch）不会走到这里，内部测试仍走 Artifacts 下载。
  publish:
    name: 发布 GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release + 上传资产所需
    steps:
      # gh CLI 需要 git 上下文来确定仓库，必须 checkout（否则 gh 报「无法确定仓库」）
      - uses: actions/checkout@v4

      - name: 汇总各平台安装包
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成 macOS 更新清单 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # 更新说明优先读 config/release-notes.txt（发版前由维护者填写总结）；
          # 为空则回退到 tag 对应 commit 的提交信息。
          NOTES=""
          if [ -f config/release-notes.txt ]; then
            NOTES="$(cat config/release-notes.txt)"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="$(git log -1 --pretty=%s 2>/dev/null || true)"
          fi
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mkdir -p release-output
          for arch in arm64 x64; do
            # 文件名后缀用 arm64/x64，updater 平台键用 aarch64/x86_64
            case "$arch" in
              arm64) PLATFORM="darwin-aarch64" ;;
              x64) PLATFORM="darwin-x86_64" ;;
            esac
            TAR=$(find artifacts -type f -name "TestBench_${arch}.app.tar.gz" | head -1)
            SIG=$(find artifacts -type f -name "TestBench_${arch}.app.tar.gz.sig" | head -1)
            [ -n "$TAR" ] && [ -n "$SIG" ] || { echo "缺少 ${arch} 更新产物"; exit 1; }
            MERGE=""
            [ "$arch" = "x64" ] && MERGE="--merge"
            node scripts/generate-update-json.mjs \
              --version "$VERSION" \
              --platform "$PLATFORM" \
              --tar "$TAR" \
              --sig "$SIG" \
              --out release-output \
              --url "$BASE/TestBench_${arch}.app.tar.gz" \
              --no-copy \
              --notes "$NOTES" \
              $MERGE
          done
          echo "==> latest.json："
          cat release-output/latest.json

      - name: 创建（或补充）Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # 安装包 + macOS 更新包 + latest.json
          mapfile -t FILES < <(
            find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.app.tar.gz' \) | sort
            find release-output -type f -name 'latest.json'
          )
          echo "待上传资产："
          printf '%s\n' "${FILES[@]}"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "未找到任何资产"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，补充上传资产"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --generate-notes --title "TestBench $TAG"
          fi
