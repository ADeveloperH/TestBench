# 双平台构建 TestBench 安装包（Windows + macOS）
# 触发方式：
#   1. 手动：仓库页面 → Actions → 本 workflow → Run workflow
#      产物在每次运行的 Artifacts 里下载（内部测试用）
#   2. 自动：推送 v* 标签（如 v0.1.0）
#      构建完成后自动创建 GitHub Release 并上传安装包，
#      用户从 https://github.com/ADeveloperH/TestBench/releases 下载
name: 构建安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install

      - name: 生成内置 adb / scrcpy 二进制
        run: powershell -ExecutionPolicy Bypass -File scripts/bundle-binaries.ps1

      - name: 构建 Windows 安装包
        run: pnpm tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: testbench-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    name: macOS 安装包（${{ matrix.arch }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            # macos-13 已于 2025-09 停用；x64(Intel) 构建改用 macos-15-intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install

      - name: 生成内置 adb / scrcpy 二进制
        run: |
          brew install scrcpy dylibbundler
          mkdir -p src-tauri/bin/macos
          curl -L -o /tmp/platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          unzip -o -q /tmp/platform-tools.zip -d /tmp
          cp /tmp/platform-tools/adb src-tauri/bin/macos/adb
          chmod +x src-tauri/bin/macos/adb
          cp "$(brew --prefix)/bin/scrcpy" src-tauri/bin/macos/scrcpy
          cp "$(brew --prefix)/share/scrcpy/scrcpy-server" src-tauri/bin/macos/scrcpy-server
          chmod +x src-tauri/bin/macos/scrcpy
          cd src-tauri/bin/macos
          dylibbundler -od -b -x ./scrcpy -d ./lib/ -p @loader_path || true
          mv lib/*.dylib . 2>/dev/null || true

      - name: 构建 macOS 安装包
        run: pnpm tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: testbench-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  # 仅 tag 推送触发：汇总三个平台的安装包，自动创建/补充 GitHub Release。
  # 手动触发（workflow_dispatch）不会走到这里，内部测试仍走 Artifacts 下载。
  publish:
    name: 发布 GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release + 上传资产所需
    steps:
      # gh CLI 需要 git 上下文来确定仓库，必须 checkout（否则 gh 报「无法确定仓库」）
      - uses: actions/checkout@v4

      - name: 汇总各平台安装包
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建（或补充）Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh --version
          TAG="${{ github.ref_name }}"
          # 只收集安装包文件（跳过 .app 目录等，Release 资产必须是单个文件）
          mapfile -t FILES < <(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) | sort)
          echo "待上传资产："
          printf '%s\n' "${FILES[@]}"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "未找到任何安装包资产"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 同 tag 重跑：Release 已存在，只补充/覆盖上传资产
            echo "Release $TAG 已存在，补充上传资产"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --generate-notes --title "TestBench $TAG"
          fi
