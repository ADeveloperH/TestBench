[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "testbench-unity-audio-extractor"
version = "0.1.0"
description = "TestBench sidecar for extracting discoverable audio from Unity resources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "UnityPy==1.25.3",
]

[project.scripts]
unity-audio-extractor = "unity_audio_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

